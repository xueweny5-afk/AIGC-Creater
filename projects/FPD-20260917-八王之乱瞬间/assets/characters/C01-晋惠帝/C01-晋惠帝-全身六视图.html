<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C01 晋惠帝 - 全身六视图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    color: #ddd;
    font-family: "Microsoft YaHei", sans-serif;
    padding: 40px;
  }
  h1 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #fff;
  }
  .subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 30px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1200px;
  }
  .card {
    background: #2a2a2a;
    border-radius: 8px;
    overflow: hidden;
  }
  .card img {
    width: 100%;
    display: block;
  }
  .label {
    padding: 12px 16px;
    font-size: 14px;
    color: #aaa;
    border-top: 1px solid #333;
  }
  .label strong {
    color: #fff;
    display: block;
    margin-bottom: 4px;
  }
  .section-title {
    font-size: 18px;
    color: #ccc;
    margin: 40px 0 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333;
  }
</style>
</head>
<body>

<h1>C01 晋惠帝 - 全身六视图</h1>
<p class="subtitle">291年体态基准 · 站姿全身 · 朴素浅色内层 · 浅灰背景</p>

<div class="section-title">标准六视图（体态正面基准）</div>
<div class="grid">
  <div class="card">
    <img src="C01-体态正面-R2-v1.png" alt="正面">
    <div class="label"><strong>正面</strong>Front · 基准角度</div>
  </div>
  <div class="card">
    <img src="C01-体左45-R2-v1.png" alt="左前45">
    <div class="label"><strong>左前 45°</strong>Left 45°</div>
  </div>
  <div class="card">
    <img src="C01-体左侧-R2-v1.png" alt="左侧90">
    <div class="label"><strong>左侧 90°</strong>Left Profile</div>
  </div>
  <div class="card">
    <img src="C01-体背面-R2-v1.png" alt="背面">
    <div class="label"><strong>背面 180°</strong>Back</div>
  </div>
  <div class="card">
    <img src="C01-体右45-R2-v1.png" alt="右前45">
    <div class="label"><strong>右前 45°</strong>Right 45°</div>
  </div>
  <div class="card">
    <img src="C01-体右侧-R2-v1.png" alt="右侧90">
    <div class="label"><strong>右侧 90°</strong>Right Profile</div>
  </div>
</div>

<div class="section-title">定妆照（服装体系）</div>
<div class="grid">
  <div class="card">
    <img src="C01-殿内定妆-R2-v1.png" alt="殿内定妆">
    <div class="label"><strong>殿内定妆</strong>K01 帝王冠服 · 291年</div>
  </div>
  <div class="card">
    <img src="C01-旅行定妆-R2-v1.png" alt="旅行定妆">
    <div class="label"><strong>旅行定妆</strong>K02 旅行穿戴 · 304年</div>
  </div>
</div>

</body>
</html>
