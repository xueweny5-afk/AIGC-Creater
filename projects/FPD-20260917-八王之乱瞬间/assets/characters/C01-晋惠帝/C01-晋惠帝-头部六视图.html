<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>C01 晋惠帝 - 头部六视图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    color: #ddd;
    font-family: "Microsoft YaHei", sans-serif;
    padding: 40px;
  }
  h1 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #fff;
  }
  .subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 30px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1200px;
  }
  .card {
    background: #2a2a2a;
    border-radius: 8px;
    overflow: hidden;
  }
  .card img {
    width: 100%;
    display: block;
  }
  .label {
    padding: 12px 16px;
    font-size: 14px;
    color: #aaa;
    border-top: 1px solid #333;
  }
  .label strong {
    color: #fff;
    display: block;
    margin-bottom: 4px;
  }
  .section-title {
    font-size: 18px;
    color: #ccc;
    margin: 40px 0 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid #333;
  }
</style>
</head>
<body>

<h1>C01 晋惠帝 - 头部六视图</h1>
<p class="subtitle">291年状态 · 头肩像 · 浅灰背景 · 中性柔光</p>

<div class="section-title">标准六视图（291年正脸基准）</div>
<div class="grid">
  <div class="card">
    <img src="C01-晋惠帝-291-正脸-R1-v3.png" alt="正脸">
    <div class="label"><strong>正脸</strong>Front · 基准角度</div>
  </div>
  <div class="card">
    <img src="C01-头左45-R2-v1.png" alt="左前45">
    <div class="label"><strong>左前 45°</strong>Left 45°</div>
  </div>
  <div class="card">
    <img src="C01-头左侧-R2-v1.png" alt="左侧90">
    <div class="label"><strong>左侧 90°</strong>Left Profile</div>
  </div>
  <div class="card">
    <img src="C01-头右45-R2-v1.png" alt="右前45">
    <div class="label"><strong>右前 45°</strong>Right 45°</div>
  </div>
  <div class="card">
    <img src="C01-头右侧-R2-v1.png" alt="右侧90">
    <div class="label"><strong>右侧 90°</strong>Right Profile</div>
  </div>
  <div class="card">
    <img src="C01-304年龄脸-R2-v1.png" alt="304年脸">
    <div class="label"><strong>304年状态</strong>Older · 乱世后</div>
  </div>
</div>

</body>
</html>
